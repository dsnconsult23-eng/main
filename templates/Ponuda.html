{% extends "base.html" %}

{% block title %}Понуди{% endblock %}

{% block content %}
  <h1>📄 Прикачи Excel фајл</h1>

  <form method="post" enctype="multipart/form-data" action="/siglife-report/ponudi/upload">
    <label for="file">Одбери Excel фајл:</label><br><br>
    <input type="file" id="file" name="file" accept=".xlsx,.xls" required>
    <br><br>
    <button type="submit">📤 Прикачи</button>
  </form>

  {% if message %}
    <p style="color: green;">{{ message }}</p>
  {% endif %}

  <hr

  <p>👉 За SOAP клиенти користи <a href="/ponudi/upload.wsdl">/ponudi/upload.wsdl</a></p>
{% endblock %}
